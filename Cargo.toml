[package]
name = "vinteria_daw"
version = "1.0.0-beta.1"
edition = "2021"
description = "Vinteria Daw - a from-scratch DAW (audio engine, synths, sequencer, piano roll, arrangement, mixer)"

[lib]
name = "vinteria_daw"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "VinteriaDaw"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
hound = "3.5"
arc-swap = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# desktop only: audio device, file dialogs and MIDI input (the first Android beta has the interface only)
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"
rfd = "0.15"
midir = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.winteria.daw"
build_targets = ["aarch64-linux-android"]
apk_name = "VinteriaDaw"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Vinteria Daw"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|density"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 4
strip = true



[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }
